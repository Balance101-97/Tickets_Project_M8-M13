name: CI – Testes Unitários, Integração e Aceitação

on:
  push:
    branches: ["**"]

jobs:

  # ─────────────────────────────────────────────────────────────
  # JOB 1 — Testes unitários + integração (Jest)
  # Não precisa de servidor real — usa BD em memória
  # ─────────────────────────────────────────────────────────────
  jest-tests:
    name: Unitários e Integração (Jest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: server-main/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('server-main/package-lock.json') }}

      - name: Instalar dependências
        run: npm install
        working-directory: server-main

      - name: Correr testes com coverage
        run: npm test
        working-directory: server-main

      - name: Enviar coverage para Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: server-main/coverage

  # ─────────────────────────────────────────────────────────────
  # JOB 2 — Testes de aceitação (Newman)
  # Inicia o servidor real e corre a coleção Postman contra ele
  # Só corre depois do Job 1 passar (needs: jest-tests)
  # ─────────────────────────────────────────────────────────────
  acceptance-tests:
    name: Aceitação (Newman)
    runs-on: ubuntu-latest
    needs: jest-tests          # só corre se os testes Jest passarem

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/cache@v4
        with:
          path: server-main/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('server-main/package-lock.json') }}

      - name: Instalar dependências
        run: npm install
        working-directory: server-main

      - name: Instalar Newman
        run: npm install -g newman

      - name: Instalar wait-on (aguarda servidor estar pronto)
        run: npm install -g wait-on

      - name: Iniciar servidor em background
        run: node src/server.js > /tmp/server.log 2>&1 &
        working-directory: server-main
        env:
          PORT: 3001
          DB_FILE: ./data/test_acceptance.db   # BD separada para aceitação
          CSV_PATH: ${{ github.workspace }}/tests/seed.csv

      - name: Aguardar servidor estar pronto
        run: wait-on http://localhost:3001/health --timeout 15000

      - name: Mostrar log do servidor (sempre, mesmo se falhar)
        if: always()    # ← corre mesmo que o step anterior falhe
        run: cat /tmp/server.log

      - name: Correr testes de aceitação (Newman)
        run: |
          newman run tests/postman_collection.json \
            --reporters cli \
            --reporter-cli-no-banner